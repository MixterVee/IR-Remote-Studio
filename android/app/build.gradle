plugins {
    id 'com.android.application'
}

// Reuse ONE private APK signing key across GitHub Actions runs.
// Without these environment variables, local Android Studio builds still
// use their own developer debug key. Public CI must fail rather than
// distribute another differently signed artifact.
def stableKeystorePath = System.getenv('IR_STUDIO_ANDROID_KEYSTORE_PATH')
def stableKeystorePassword = System.getenv('IR_STUDIO_ANDROID_KEYSTORE_PASSWORD')
def stableSigningConfigured =
        stableKeystorePath != null && !stableKeystorePath.isBlank()
        && stableKeystorePassword != null && !stableKeystorePassword.isBlank()

android {
    namespace 'com.mixtervee.irstudio'
    compileSdk 35

    defaultConfig {
        applicationId 'com.mixtervee.irstudio'
        minSdk 26
        targetSdk 34
        versionCode 26
        versionName '0.4.3-alpha'
    }

    // This dedicated test signing key must never be committed to Git.
    signingConfigs {
        persistentDebug {
            if (stableSigningConfigured) {
                storeFile file(stableKeystorePath)
                storePassword stableKeystorePassword
                keyAlias 'irstudio'
                keyPassword stableKeystorePassword
                storeType 'PKCS12'
            }
        }
    }

    buildTypes {
        debug {
            if (stableSigningConfigured) {
                signingConfig signingConfigs.persistentDebug
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
