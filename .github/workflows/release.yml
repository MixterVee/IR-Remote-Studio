name: Publish Windows beta release

# First public release, triggered by this new workflow file. For future
# releases, manually dispatch after updating version and release notes.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-ui-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tk + Xvfb
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - name: Run all tests (including GUI)
        run: xvfb-run -a /usr/bin/python3 -m unittest discover -s tests -v

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Install packager
        run: python -m pip install pyinstaller==6.16.0 pillow
      - name: Create Windows icon
        run: python scripts/build_icon.py
      - name: Package branded Windows EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name IR-Remote-Studio --icon "assets/ir_remote_studio.ico" --add-data "assets/ir_remote_studio.png;assets" --add-data "irstudio/Xflyee_IR_Worker.ps1;." --add-data "irstudio/harmony_models.json;." run.py
      - name: Stage release files
        shell: pwsh
        run: |
          Copy-Item WINDOWS-SETUP.txt dist/
          Copy-Item LICENSE dist/
          Copy-Item THIRD_PARTY_NOTICES.md dist/
          Copy-Item RELEASE_NOTES.md dist/
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release-payload
          path: dist/
          retention-days: 30

  publish:
    needs: [linux-ui-tests, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-release-payload
          path: dist/
      - name: Create portable ZIP and checksum
        run: |
          cd dist
          zip -9 -j ../IR-Remote-Studio-v0.1.7-Windows-x64.zip IR-Remote-Studio.exe WINDOWS-SETUP.txt LICENSE THIRD_PARTY_NOTICES.md RELEASE_NOTES.md
          cd ..
          sha256sum IR-Remote-Studio-v0.1.7-Windows-x64.zip > SHA256SUMS.txt
      - name: Publish v0.1.7 beta release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.7 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v0.1.7 already exists; keeping the original published assets."
            exit 0
          fi
          gh release create v0.1.7 \
            IR-Remote-Studio-v0.1.7-Windows-x64.zip SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "IR Remote Studio v0.1.7 — Windows beta" \
            --notes-file RELEASE_NOTES.md \
            --prerelease
