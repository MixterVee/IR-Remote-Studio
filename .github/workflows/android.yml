name: Android prototype APK
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

# Keep only the newest run for each PR + workflow when making successive
# small fixes. Android and Windows have separate groups.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      # Always compile and run unit tests, even before the owner has
      # configured the permanent certificate. No disposable-key APK uploaded.
      - name: Run Android unit tests before signing setup
        run: gradle -p android --no-daemon :app:testDebugUnitTest

      # Secrets are created once on the owner's Windows PC using
      # android/scripts/setup-signing.ps1. NO signing keys in the repository.
      # Do not publish ephemeral GitHub-run debug certificates: they force
      # users to uninstall and wipe their local remotes/backup files.
      - name: Require reusable APK signing certificate
        env:
          SIGNING_KEY_B64: ${{ secrets.IR_STUDIO_ANDROID_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.IR_STUDIO_ANDROID_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          if [[ -z "$SIGNING_KEY_B64" || -z "$SIGNING_PASSWORD" ]]; then
            echo "::error::Permanent Android signing secrets are not configured. Run android/scripts/setup-signing.ps1 on the repository owner's PC. No APK will be published with a disposable key."
            exit 1
          fi
          printf '%s' "$SIGNING_KEY_B64" | base64 --decode > "$RUNNER_TEMP/ir-studio-signing.p12"
          chmod 600 "$RUNNER_TEMP/ir-studio-signing.p12"
          keytool -list -keystore "$RUNNER_TEMP/ir-studio-signing.p12" \
            -storetype PKCS12 -storepass "$SIGNING_PASSWORD" \
            -alias irstudio > /dev/null
          echo "Reusable Android test signing certificate validated."

      - name: Build APK with reusable signing key
        env:
          IR_STUDIO_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/ir-studio-signing.p12
          IR_STUDIO_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.IR_STUDIO_ANDROID_KEYSTORE_PASSWORD }}
        run: gradle -p android --no-daemon :app:assembleDebug

      - name: Confirm packaged APK certificate
        shell: bash
        run: |
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose \
            --print-certs android/app/build/outputs/apk/debug/app-debug.apk | \
            grep -E 'Verifies|Signer #1 certificate SHA-256 digest'

      - name: Upload persistently signed Android test APK
        uses: actions/upload-artifact@v4
        with:
          name: IR-Remote-Studio-v0.4.4-alpha-Android-persistently-signed
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 60

      - name: Remove private signing key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/ir-studio-signing.p12"
